u<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://js.paystack.co/v1/inline.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Austin Smart Mall — Nigeria's Smart Marketplace</title>
<meta name="description" content="Austin Smart Mall — shop Nigerian products with Naira pricing, Paystack payments, WhatsApp ordering, and Amara AI assistant.">
<meta name="theme-color" content="#1B2A4A">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://austinsmartmall.ng/">
<meta property="og:type" content="website">
<meta property="og:title" content="Austin Smart Mall — Nigeria">
<meta property="og:description" content="Nigerian marketplace with Naira pricing, Paystack, WhatsApp orders, and AI shopping assistant.">
<meta property="og:locale" content="en_NG">
<meta property="og:site_name" content="Austin Smart Mall">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Austin Smart Mall — Nigeria">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Austin Smart Mall">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇳🇬</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --asm-navy:#1B2A4A;--asm-gold:#E8A020;--asm-sage:#4A7C5F;--asm-cream:#F7F4EE;--asm-accent:#C85A2A;
  --surface-0:#F2F0EB;--surface-1:#F7F6F2;--surface-2:#FFFFFF;
  --text-primary:#1A1A18;--text-secondary:#5F5E5A;--text-muted:#888780;
  --border:rgba(0,0,0,.1);--border-strong:rgba(0,0,0,.18);
  --bg-accent:#E6F1FB;--text-accent:#185FA5;--border-accent:#378ADD;
  --bg-success:#EAF3DE;--text-success:#3B6D11;
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --radius:8px;
}
@media(prefers-color-scheme:dark){
  :root{
    --surface-0:#1A1A18;--surface-1:#222220;--surface-2:#2C2C2A;
    --text-primary:#F0EEE8;--text-secondary:#B4B2A9;--text-muted:#888780;
    --border:rgba(255,255,255,.1);--border-strong:rgba(255,255,255,.18);
    --bg-accent:#042C53;--text-accent:#85B7EB;--border-accent:#185FA5;
    --bg-success:#173404;--text-success:#97C459;
  }
}
body{font-family:var(--font-sans);background:var(--surface-0);color:var(--text-primary);max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

.mall-header{background:var(--asm-navy);color:#fff;padding:14px 16px 10px;position:sticky;top:0;z-index:100}
.mall-logo{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.logo-badge{background:var(--asm-gold);color:var(--asm-navy);font-size:11px;font-weight:600;padding:2px 7px;border-radius:3px}
.logo-name{font-size:17px;font-weight:600;color:#fff;letter-spacing:-.02em}
.logo-sub{font-size:11px;color:rgba(255,255,255,.55);margin-left:2px}
.search-row{display:flex;gap:8px;align-items:center}
.search-wrap{flex:1;position:relative}
.search-wrap input{width:100%;background:rgba(255,255,255,.12);border:0.5px solid rgba(255,255,255,.2);border-radius:8px;padding:8px 12px 8px 34px;font-size:13px;color:#fff;outline:none}
.search-wrap input::placeholder{color:rgba(255,255,255,.45)}
.search-wrap i{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:16px;color:rgba(255,255,255,.5)}
.cart-btn,.dash-btn{background:rgba(255,255,255,.1);border:0.5px solid rgba(255,255,255,.2);border-radius:8px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;position:relative;flex-shrink:0}
.cart-count{position:absolute;top:-4px;right:-4px;background:var(--asm-gold);color:var(--asm-navy);font-size:9px;font-weight:600;border-radius:10px;padding:1px 4px;min-width:14px;text-align:center;display:none}
.nav-tabs{display:flex;gap:0;overflow-x:auto;background:rgba(255,255,255,.06);border-radius:6px;padding:3px;margin:10px 0 0}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{flex-shrink:0;padding:5px 12px;border-radius:5px;font-size:12px;color:rgba(255,255,255,.6);cursor:pointer;white-space:nowrap;border:none;background:none;transition:all .15s}
.nav-tab.active{background:rgba(255,255,255,.15);color:#fff}

.screen{display:none}
.screen.active{display:block}

.hero{background:linear-gradient(135deg,var(--asm-navy) 0%,#2d4a7a 100%);padding:20px 16px 24px;color:#fff}
.hero-eyebrow{font-size:11px;color:var(--asm-gold);margin-bottom:6px}
.hero-title{font-size:24px;font-weight:600;line-height:1.2;margin-bottom:8px}
.hero-title em{font-style:normal;color:var(--asm-gold)}
.hero-sub{font-size:13px;color:rgba(255,255,255,.7);line-height:1.5;margin-bottom:16px;max-width:280px}
.hero-ctas{display:flex;gap:8px;flex-wrap:wrap}
.btn-primary-hero{background:var(--asm-gold);color:var(--asm-navy);border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer}
.btn-ghost-hero{background:rgba(255,255,255,.1);color:#fff;border:0.5px solid rgba(255,255,255,.3);border-radius:8px;padding:9px 14px;font-size:13px;cursor:pointer}
.hero-badge-group{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
.hero-badge{background:rgba(255,255,255,.1);border:0.5px solid rgba(255,255,255,.15);border-radius:20px;padding:4px 10px;font-size:11px;color:rgba(255,255,255,.75)}

.section{padding:16px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-title{font-size:15px;font-weight:600}
.section-link{font-size:12px;color:var(--asm-sage);cursor:pointer;border:none;background:none;padding:0}

.cats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cat-card{background:var(--surface-1);border:0.5px solid var(--border);border-radius:12px;padding:14px 12px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:border-color .15s}
.cat-card:hover{border-color:var(--border-strong)}
.cat-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.cat-name{font-size:13px;font-weight:500;margin-bottom:1px}
.cat-count{font-size:11px;color:var(--text-secondary)}

.products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.product-card{background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.product-card:hover{border-color:var(--border-strong)}
.product-img{height:110px;display:flex;align-items:center;justify-content:center;font-size:44px;background:var(--surface-1)}
.product-body{padding:10px}
.product-vendor{font-size:10px;color:var(--text-muted);margin-bottom:3px}
.product-name{font-size:12px;font-weight:500;line-height:1.3;margin-bottom:6px}
.product-footer{display:flex;align-items:center;justify-content:space-between}
.product-price{font-size:14px;font-weight:600;color:var(--asm-navy)}
.product-add{width:26px;height:26px;border-radius:50%;background:var(--asm-sage);border:none;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.badge-free{background:#E8F5E9;color:#2E7D32;font-size:9px;padding:2px 5px;border-radius:3px;font-weight:500}
.badge-sale{background:#FFF3E0;color:#E65100;font-size:9px;padding:2px 5px;border-radius:3px;font-weight:500}
.badge-aff{background:#E3F2FD;color:#1565C0;font-size:9px;padding:2px 5px;border-radius:3px;font-weight:500}

.promo-strip{margin:0 16px 16px;background:var(--asm-cream);border:0.5px solid var(--border);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px}
.promo-icon{width:40px;height:40px;background:var(--asm-accent);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;flex-shrink:0}
.promo-title{font-size:13px;font-weight:600;color:var(--asm-navy);margin-bottom:2px}
.promo-sub{font-size:11px;color:var(--text-secondary);line-height:1.4}
.promo-btn{margin-left:auto;background:var(--asm-navy);color:#fff;border:none;border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer;flex-shrink:0;white-space:nowrap}

.vendors-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.vendors-scroll::-webkit-scrollbar{display:none}
.vendor-chip{flex-shrink:0;background:var(--surface-1);border:0.5px solid var(--border);border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.vendor-dot{width:8px;height:8px;border-radius:50%;background:var(--asm-sage)}

.ai-screen{padding:16px}
.ai-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:14px;border-bottom:0.5px solid var(--border)}
.ai-avatar{width:40px;height:40px;border-radius:50%;background:var(--asm-navy);display:flex;align-items:center;justify-content:center;color:var(--asm-gold);font-size:18px;flex-shrink:0}
.ai-name{font-size:14px;font-weight:600}
.ai-status{font-size:11px;color:var(--asm-sage)}
.chat-area{display:flex;flex-direction:column;gap:10px;min-height:200px;margin-bottom:14px;max-height:340px;overflow-y:auto}
.msg{max-width:85%;padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.5}
.msg-ai{background:var(--surface-1);border:0.5px solid var(--border);border-bottom-left-radius:4px;align-self:flex-start}
.msg-user{background:var(--asm-navy);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.quick-replies{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.quick-reply{background:none;border:0.5px solid var(--border-strong);border-radius:16px;padding:5px 10px;font-size:11px;cursor:pointer;color:var(--text-secondary)}
.chat-input-row{display:flex;gap:8px;align-items:flex-end}
.chat-input-row textarea{flex:1;border:0.5px solid var(--border);border-radius:10px;padding:9px 12px;font-size:13px;resize:none;height:38px;font-family:var(--font-sans);background:var(--surface-2);color:var(--text-primary);outline:none}
.chat-send{width:38px;height:38px;border-radius:10px;background:var(--asm-navy);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}

.cart-screen{padding:16px}
.cart-empty{text-align:center;padding:40px 16px}
.cart-items{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.cart-item{background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center}
.cart-item-img{width:50px;height:50px;background:var(--surface-1);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.cart-item-info{flex:1}
.cart-item-name{font-size:13px;font-weight:500;margin-bottom:2px}
.cart-item-vendor{font-size:11px;color:var(--text-muted)}
.cart-item-price{font-size:14px;font-weight:600;color:var(--asm-navy)}
.cart-remove{background:none;border:none;color:var(--text-muted);cursor:pointer;padding:4px;font-size:16px}
.cart-summary{background:var(--surface-1);border-radius:12px;padding:14px;margin-bottom:16px}
.cart-row{display:flex;justify-content:space-between;font-size:13px;color:var(--text-secondary);margin-bottom:8px}
.cart-row.total{font-size:15px;font-weight:600;color:var(--text-primary);margin-bottom:0;padding-top:10px;border-top:0.5px solid var(--border)}
.checkout-btn,.paystack-btn,.whatsapp-btn{width:100%;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:8px}
.checkout-btn{background:var(--asm-navy);color:#fff}
.paystack-btn{background:#0BA4DB;color:#fff}
.whatsapp-btn{background:#25D366;color:#fff}
.upgrade-teaser{background:var(--asm-cream);border:0.5px solid var(--border);border-radius:10px;padding:12px;margin-top:12px;display:flex;align-items:center;gap:10px}

.vendor-screen{padding:16px}
.vendor-hero{background:var(--asm-sage);border-radius:12px;padding:20px;color:#fff;margin-bottom:16px}
.vendor-name{font-size:18px;font-weight:600;margin-bottom:4px}
.vendor-meta{font-size:12px;color:rgba(255,255,255,.75);margin-bottom:12px}
.vendor-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vstat{background:rgba(255,255,255,.15);border-radius:8px;padding:8px;text-align:center}
.vstat-num{font-size:16px;font-weight:600}
.vstat-label{font-size:10px;color:rgba(255,255,255,.7)}
.plan-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.plan-card{background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:14px}
.plan-card.featured{border:2px solid var(--border-accent)}
.plan-badge{font-size:10px;padding:2px 8px;border-radius:10px;margin-bottom:8px;display:inline-block;background:var(--bg-accent);color:var(--text-accent)}
.plan-price{font-size:22px;font-weight:600;margin:6px 0 2px}
.plan-period{font-size:11px;color:var(--text-secondary)}
.plan-features{margin-top:10px;display:flex;flex-direction:column;gap:4px}
.plan-feature{font-size:11px;color:var(--text-secondary);display:flex;align-items:center;gap:5px}
.plan-cta{width:100%;margin-top:12px;padding:8px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:0.5px solid var(--border-strong);background:none;color:var(--text-primary)}
.plan-cta.accent{background:var(--asm-navy);color:#fff;border:none}

.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;font-weight:500;margin-bottom:4px;color:var(--text-secondary)}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:0.5px solid var(--border);border-radius:8px;font-size:13px;background:var(--surface-2);color:var(--text-primary);font-family:var(--font-sans);outline:none}
.form-group textarea{min-height:80px;resize:vertical}
.btn-submit{width:100%;background:var(--asm-navy);color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:600;cursor:pointer}

.bottom-nav{position:sticky;bottom:0;background:var(--surface-2);border-top:0.5px solid var(--border);display:flex;padding:8px 0 12px;z-index:90}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border:none;background:none;color:var(--text-muted);padding:0;transition:color .15s}
.bn-item.active{color:var(--asm-navy)}
.bn-item i{font-size:22px}
.bn-item span{font-size:9px}

.product-detail{padding:0 0 16px}
.pd-img{height:180px;background:var(--surface-1);display:flex;align-items:center;justify-content:center;font-size:80px}
.pd-body{padding:14px 16px}
.pd-vendor-tag{font-size:11px;color:var(--text-muted);margin-bottom:6px}
.pd-title{font-size:18px;font-weight:600;margin-bottom:6px;line-height:1.3}
.pd-price-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.pd-price{font-size:22px;font-weight:600;color:var(--asm-navy)}
.pd-orig{font-size:14px;color:var(--text-muted);text-decoration:line-through}
.pd-desc{font-size:13px;color:var(--text-secondary);line-height:1.6;margin-bottom:16px}
.pd-features{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.pd-feature{background:var(--surface-1);border-radius:8px;padding:8px;font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:6px}
.pd-actions{padding:0 16px;display:flex;flex-direction:column;gap:8px}
.pd-add-cart{width:100%;background:var(--asm-navy);color:#fff;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:600;cursor:pointer}
.pd-wa{width:100%;background:#25D366;color:#fff;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.back-btn{background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-secondary);padding:12px 16px}

.ai-product-card{background:var(--surface-1);border:0.5px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:8px;display:flex;align-items:center;gap:10px;cursor:pointer}
.ai-product-emoji{font-size:28px;width:42px;height:42px;background:var(--surface-2);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ai-product-info{flex:1}
.ai-product-name{font-size:12px;font-weight:500}
.ai-product-price{font-size:11px;color:var(--text-secondary)}
.ai-product-add{font-size:11px;color:var(--asm-sage);border:none;background:none;cursor:pointer;white-space:nowrap}

.dash-screen{padding:16px}
.dash-card{background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.dash-stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.dash-stat{background:var(--surface-1);border-radius:10px;padding:12px;text-align:center}
.dash-stat-num{font-size:20px;font-weight:600;color:var(--asm-navy)}
.dash-stat-label{font-size:11px;color:var(--text-secondary)}
.order-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:0.5px solid var(--border);font-size:13px}
.order-status{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--bg-success);color:var(--text-success)}
.marketing-box{background:var(--surface-1);border-radius:10px;padding:12px;margin-top:8px;font-size:13px;line-height:1.5;white-space:pre-wrap}
.copy-btn{margin-top:8px;background:var(--asm-navy);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:12px;cursor:pointer}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--asm-navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:200;display:none;max-width:90%;text-align:center}

/* qty controls */
.qty-row{display:flex;align-items:center;gap:8px}
.qty-btn{width:28px;height:28px;border-radius:50%;border:1px solid var(--border-strong);background:none;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.qty-num{font-size:14px;font-weight:600;min-width:20px;text-align:center}
</style>
</head>
<body>

<div class="mall-header">
  <div class="mall-logo">
    <span class="logo-badge">NG</span>
    <span class="logo-name">Austin Smart Mall</span>
    <span class="logo-sub">Nigeria</span>
    <span id="authStatus" style="margin-left:auto;display:flex;align-items:center"></span>
  </div>
  <div class="search-row">
    <div class="search-wrap">
      <i class="ti ti-search" aria-hidden="true"></i>
      <input type="text" placeholder="Search products, vendors…" id="searchInput" autocomplete="off">
    </div>
    <button class="cart-btn" onclick="showScreen('cart')" aria-label="View cart">
      <i class="ti ti-shopping-cart" aria-hidden="true"></i>
      <span class="cart-count" id="cartCount">0</span>
    </button>
    <button class="dash-btn" onclick="showScreen('dashboard')" aria-label="Owner dashboard" title="Dashboard">
      <i class="ti ti-layout-dashboard" aria-hidden="true"></i>
    </button>
  </div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showScreen('home',this)">Home</button>
    <button class="nav-tab" onclick="showScreen('products',this)">Browse</button>
    <button class="nav-tab" onclick="showScreen('ai',this)">AI Advisor</button>
    <button class="nav-tab" onclick="showScreen('vendors',this)">Sell</button>
    <button class="nav-tab" onclick="showScreen('cart',this)">Cart</button>
  </div>
</div>

<!-- HOME -->
<div id="home" class="screen active">
  <div class="hero">
    <div class="hero-eyebrow">Nigeria's smart shopping destination</div>
    <div class="hero-title">Shop local.<br><em>Think smart.</em></div>
    <div class="hero-sub">Real Nigerian vendors. Naira pricing. Paystack & WhatsApp ordering.</div>
    <div class="hero-ctas">
      <button class="btn-primary-hero" onclick="showScreen('products')">Shop now</button>
      <button class="btn-ghost-hero" onclick="showScreen('ai')">A
